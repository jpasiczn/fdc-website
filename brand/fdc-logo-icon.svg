<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 12 260 260" role="img">

  <title>Foundation Dental Center — Arch Icon Mark</title>
  <desc>
    Standalone icon mark, transparent background.
    Use for favicon (convert to .ico/.png at 32/64/128 px), social avatar,
    app icon, embossing, and any context where typography is unnecessary.
    Square viewBox 170 12 260 260 centres arch precisely:
      Horizontal padding: 25.5 px each side (arch outer edge x 195.5 / 404.5)
      Vertical padding:   47.5 px top/bottom (arch top y 59.5, bottom y 224.5)
    Arch paths are byte-for-byte identical to fdc-logo-primary-light.svg.
  </desc>

  <defs>
    <style>
      .brass { stroke:#B2884D; fill:none; }
    </style>
  </defs>

  <!-- ================================================================
       ARCH MARK — master geometry, locked
  ================================================================ -->
  <g id="logo-mark">
    <path class="brass" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
          d="M 276 220 L 276 164 A 24 24 0 0 1 324 164 L 324 220"/>
    <path class="brass" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
          d="M 257 220 L 257 164 A 43 43 0 0 1 343 164 L 343 220"/>
    <path class="brass" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
          d="M 238 220 L 238 164 A 62 62 0 0 1 362 164 L 362 220"/>
    <path class="brass" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
          d="M 219 220 L 219 164 A 81 81 0 0 1 381 164 L 381 220"/>
    <path class="brass" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
          d="M 200 220 L 200 164 A 100 100 0 0 1 400 164 L 400 220"/>
  </g>

</svg>
