<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="194 47 212 212" role="img">
  <title>Foundation Dental Center — Pillar Motif, One-Color White</title>
  <desc>Single-color white. Transparent background. Requires dark surface. Motif only, no wordmark. Use for white foil, frosted glass, window vinyl.</desc>
  <defs>
    <style>.mono-w { stroke:#FFFFFF; fill:none; }</style>
  </defs>
  <g id="pillar-motif" class="mono-w">
    <line stroke-width="5" x1="228" y1="85"  x2="372" y2="85"/>
    <line stroke-width="5" x1="228" y1="220" x2="372" y2="220"/>
    <line stroke-width="3" x1="240" y1="85"  x2="240" y2="220"/>
    <line stroke-width="3" x1="280" y1="85"  x2="280" y2="220"/>
    <line stroke-width="3" x1="320" y1="85"  x2="320" y2="220"/>
    <line stroke-width="3" x1="360" y1="85"  x2="360" y2="220"/>
  </g>
</svg>
